site_name: remblais
site_description: Sinkhorn divergences, kernel MMD and optimal transport on NVIDIA, AMD and Intel GPUs (CUDA, HIP, SYCL), a drop-in GeomLoss replacement built on kernox
site_url: https://keckj.github.io/remblais/
repo_url: https://github.com/keckj/remblais
repo_name: keckj/remblais
copyright: remblais is dual-licensed MIT or Apache-2.0

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle: {icon: material/weather-sunny, name: Light mode}
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight

hooks:
  - tools/mkdocs_hooks.py

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_source: false
            show_root_heading: true
            members_order: source
            docstring_style: sphinx
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - tables
  - toc: {permalink: true}
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets: {base_path: ["."], check_paths: true}

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts: concepts.md
  - How-to guides:
      - Sinkhorn divergence between point clouds: guides/sinkhorn.md
      - Gradient flows: guides/gradient-flow.md
      - Kernel MMD: guides/kernels.md
      - Hausdorff divergence: guides/hausdorff.md
      - Images and volumes: guides/images.md
      - The ot API: guides/ot.md
  - Coming from GeomLoss: geomloss.md
  - Performance: performance.md
  - API reference: reference.md
