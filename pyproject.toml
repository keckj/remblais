[build-system]
requires = ["setuptools>=77"]  # PEP 639: SPDX license expression, license-files
build-backend = "setuptools.build_meta"

[project]
name = "remblais"
dynamic = ["version"]  # remblais.__version__
description = "Sinkhorn divergences, kernel MMD and optimal transport on NVIDIA, AMD and Intel GPUs (CUDA, HIP, SYCL) and x86-64 CPUs, optionally split across compute nodes: a drop-in GeomLoss replacement built on kernox"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "THIRD_PARTY.md"]
requires-python = ">=3.10"
authors = [{ name = "Jean-Baptiste Keck" }]
keywords = ["optimal transport", "sinkhorn", "wasserstein", "mmd", "geomloss", "gpu", "cpu", "cuda", "rocm", "sycl", "pytorch"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Environment :: GPU :: NVIDIA CUDA",
]
# kernox: the plain package is enough for the CPU; install it with the extra of
# your GPU (kernox[cuda], kernox[rocm], kernox[xpu]) for the GPU backends.
# torch: installed from the platform-specific index (CUDA, ROCm, XPU), as for kernox.
dependencies = ["numpy", "scipy", "torch", "kernox>=1.2.0"]

[project.optional-dependencies]
# geomloss 0.3.1 is the reference implementation the tests compare against.
test = ["pytest", "pytest-check", "hypothesis", "geomloss==0.3.1"]

[project.urls]
Homepage = "https://github.com/keckj/remblais"
Documentation = "https://keckj.github.io/remblais/"
Source = "https://github.com/keckj/remblais"
Issues = "https://github.com/keckj/remblais/issues"
Changelog = "https://github.com/keckj/remblais/releases"
kernox = "https://github.com/keckj/kernox"

[tool.setuptools.dynamic]
version = { attr = "remblais.__version__" }

[tool.setuptools.packages.find]
include = ["remblais*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
