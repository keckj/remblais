[build-system]
requires = ["setuptools>=77"]  # PEP 639: SPDX license expression, license-files
build-backend = "setuptools.build_meta"

[project]
name = "remblais"
dynamic = ["version"]  # remblais.__version__
description = "Sinkhorn divergences, kernel MMD and optimal transport on NVIDIA, AMD and Intel GPUs (CUDA, HIP, SYCL): a drop-in GeomLoss replacement built on kernox"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "THIRD_PARTY.md"]
requires-python = ">=3.10"
authors = [{ name = "Jean-Baptiste Keck" }]
classifiers = ["Programming Language :: Python :: 3"]
# kernox: the plain package is enough for the CPU reference path; install it
# with the extra of your GPU (kernox[cuda], kernox[rocm], kernox[xpu]) for speed.
# torch: installed from the platform-specific index (CUDA, ROCm, XPU), as for kernox.
dependencies = ["numpy", "scipy", "torch", "kernox>=1.0.1"]

[project.optional-dependencies]
# geomloss 0.3.1 is the reference implementation the tests compare against.
test = ["pytest", "pytest-check", "hypothesis", "geomloss==0.3.1"]

[project.urls]
Source = "https://github.com/keckj/remblais"
Documentation = "https://keckj.github.io/remblais/"
kernox = "https://github.com/keckj/kernox"

[tool.setuptools.dynamic]
version = { attr = "remblais.__version__" }

[tool.setuptools.packages.find]
include = ["remblais*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
